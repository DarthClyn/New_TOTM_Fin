<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOTM Finance Automation - Dashboard</title>
    <link rel="stylesheet" href="src/common/ui/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: var(--bg-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        .dashboard-container {
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        .process-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 40px;
        }

        .process-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .process-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            border-color: var(--accent-blue);
        }

        .process-card i {
            font-size: 3rem;
            color: var(--accent-blue);
            margin-bottom: 20px;
        }

        .process-card h2 {
            font-size: 1.25rem;
            margin-bottom: 12px;
        }

        .process-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <h1>TOTM Finance Automation Hub</h1>
        <p class="text-muted">Select a process to begin</p>

        <div class="process-grid">
            <a href="src/process_1/index.html" class="process-card">
                <i class="fa-solid fa-file-invoice-dollar"></i>
                <h2>Process 1</h2>
                <p>Supplier Invoice Matching & Audit</p>
            </a>

            <a href="src/process_2/index.html" class="process-card">
                <i class="fa-solid fa-gears" style="color: var(--accent-cyan);"></i>
                <h2>Process 2</h2>
                <p>Employee Claims Automation</p>
            </a>
        </div>
    </div>
</body>

</html>
